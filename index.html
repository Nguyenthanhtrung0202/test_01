<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TinyBee • FAN1</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --secondary: #86868b;
      --line: #eeeeef;
      --green: #34c759;
      --red: #ff3b30;
      --gray: #e5e5ea;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 30px 20px 40px;
    }

    .header {
      margin-bottom: 22px;
    }

    .header h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.9px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 15px;
      color: var(--secondary);
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 15px;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.03),
        0 10px 30px rgba(0, 0, 0, 0.045);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .control-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.25px;
    }

    .control-subtitle {
      margin-top: 4px;
      font-size: 14px;
      color: var(--secondary);
    }

    /* iOS-like toggle */
    .switch {
      position: relative;
      width: 62px;
      height: 36px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--gray);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.18);
      transition:
        transform 0.2s cubic-bezier(.4,0,.2,1);
    }

    .switch input:checked + .slider {
      background: var(--green);
    }

    .switch input:checked + .slider::before {
      transform: translateX(26px);
    }

    .status-row {
      display: flex;
      align-items: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--secondary);
      font-size: 14px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      margin-right: 9px;
      border-radius: 50%;
      background: #8e8e93;
      transition: all 0.2s ease;
    }

    .status-dot.on {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(52,199,89,0.12);
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8e8e93;
    }

    .connection-dot.connected {
      background: var(--green);
    }

    .connection-dot.error {
      background: var(--red);
    }

    .info-list {
      display: flex;
      flex-direction: column;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .info-row:first-child {
      padding-top: 0;
    }

    .info-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .label {
      font-size: 14px;
      color: var(--secondary);
    }

    .value {
      max-width: 65%;
      font-size: 14px;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
    }

    .footer {
      margin-top: 8px;
      text-align: center;
      color: #a1a1a6;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>TinyBee</h1>
    <p>Remote Control Panel</p>
  </div>

  <!-- FAN1 CONTROL -->
  <div class="card">

    <div class="control-row">

      <div>
        <div class="control-title">
          Solenoid Valve
        </div>

        <div class="control-subtitle">
          FAN1 • 24V / 0.85W
        </div>
      </div>

      <label class="switch">
        <input
          id="fanSwitch"
          type="checkbox"
          disabled
        >
        <span class="slider"></span>
      </label>

    </div>


    <div class="status-row">

      <div
        id="statusDot"
        class="status-dot">
      </div>

      <div id="statusText">
        Đang kết nối...
      </div>

    </div>

  </div>


  <!-- MQTT -->
  <div class="card">

    <div class="connection">

      <span
        id="connectionDot"
        class="connection-dot">
      </span>

      <span id="connectionText">
        MQTT đang kết nối...
      </span>

    </div>

  </div>


  <!-- INFO -->
  <div class="card">

    <div class="info-list">

      <div class="info-row">
        <div class="label">Device</div>
        <div class="value">MKS TinyBee V1.0</div>
      </div>

      <div class="info-row">
        <div class="label">Output</div>
        <div class="value">FAN1 / IO147</div>
      </div>

      <div class="info-row">
        <div class="label">MQTT Broker</div>
        <div class="value">broker.hivemq.com</div>
      </div>

      <div class="info-row">
        <div class="label">Command Topic</div>
        <div class="value" id="cmdTopic"></div>
      </div>

      <div class="info-row">
        <div class="label">State Topic</div>
        <div class="value" id="stateTopic"></div>
      </div>

    </div>

  </div>


  <div class="footer">
    TinyBee • FAN1 Test
  </div>

</div>


<script>

  // ============================================================
  // MQTT SETTINGS
  // ============================================================

  // Secure WebSocket so this page works from GitHub Pages (HTTPS).
  const MQTT_URL =
    "wss://broker.hivemq.com:8884/mqtt";

  const MQTT_CMD_TOPIC =
    "tinybee/test123/fan1/cmd";

  const MQTT_STATE_TOPIC =
    "tinybee/test123/fan1/state";

  const CLIENT_ID =
    "TinyBeeWeb-" +
    Math.random().toString(16).slice(2, 10);


  // ============================================================
  // DOM
  // ============================================================

  const fanSwitch =
    document.getElementById("fanSwitch");

  const statusDot =
    document.getElementById("statusDot");

  const statusText =
    document.getElementById("statusText");

  const connectionDot =
    document.getElementById("connectionDot");

  const connectionText =
    document.getElementById("connectionText");


  document.getElementById("cmdTopic").textContent =
    MQTT_CMD_TOPIC;

  document.getElementById("stateTopic").textContent =
    MQTT_STATE_TOPIC;


  // ============================================================
  // LED / VALVE UI
  // ============================================================

  function updateUI(isOn) {

    fanSwitch.checked = isOn;

    if (isOn) {

      statusDot.classList.add("on");

      statusText.textContent =
        "Van đang mở";

    } else {

      statusDot.classList.remove("on");

      statusText.textContent =
        "Van đang đóng";
    }
  }


  // ============================================================
  // MQTT CONNECTION STATUS
  // ============================================================

  function setConnectionState(
    state,
    message
  ) {

    connectionDot.classList.remove(
      "connected",
      "error"
    );

    if (state === "connected") {
      connectionDot.classList.add(
        "connected"
      );
    }

    if (state === "error") {
      connectionDot.classList.add(
        "error"
      );
    }

    connectionText.textContent =
      message;
  }


  // ============================================================
  // CONNECT
  // ============================================================

  const client = mqtt.connect(
    MQTT_URL,
    {
      clientId: CLIENT_ID,
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 3000
    }
  );


  client.on(
    "connect",
    function () {

      setConnectionState(
        "connected",
        "Đã kết nối MQTT"
      );

      fanSwitch.disabled = false;

      client.subscribe(
        MQTT_STATE_TOPIC,
        { qos: 0 },
        function (err) {

          if (err) {

            setConnectionState(
              "error",
              "Subscribe thất bại"
            );

            return;
          }
        }
      );
    }
  );


  client.on(
    "reconnect",
    function () {

      fanSwitch.disabled = true;

      setConnectionState(
        "connecting",
        "Đang kết nối lại..."
      );
    }
  );


  client.on(
    "close",
    function () {

      fanSwitch.disabled = true;

      setConnectionState(
        "connecting",
        "MQTT đã ngắt kết nối"
      );
    }
  );


  client.on(
    "error",
    function (err) {

      fanSwitch.disabled = true;

      setConnectionState(
        "error",
        "Lỗi MQTT"
      );

      console.error(
        "MQTT error:",
        err
      );
    }
  );


  // ============================================================
  // RECEIVE REAL STATE FROM TINYBEE
  // ============================================================

  client.on(
    "message",
    function (topic, payload) {

      if (topic !== MQTT_STATE_TOPIC) {
        return;
      }

      const state =
        payload
          .toString()
          .trim()
          .toUpperCase();

      if (state === "ON") {
        updateUI(true);
      }

      if (state === "OFF") {
        updateUI(false);
      }
    }
  );


  // ============================================================
  // SEND ON / OFF
  // ============================================================

  fanSwitch.addEventListener(
    "change",
    function () {

      if (!client.connected) {

        updateUI(
          !fanSwitch.checked
        );

        return;
      }

      const message =
        fanSwitch.checked
          ? "ON"
          : "OFF";


      client.publish(
        MQTT_CMD_TOPIC,
        message,
        { qos: 0 },
        function (err) {

          if (err) {

            console.error(
              "Publish error:",
              err
            );

            // Revert UI if publish failed.
            updateUI(
              !fanSwitch.checked
            );
          }
        }
      );
    }
  );


  // Initial UI
  updateUI(false);

</script>

</body>
</html>
